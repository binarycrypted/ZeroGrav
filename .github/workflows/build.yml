name: Build Tweak
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos
        uses: erik-smit/theos-action@v1
        with:
          sdks: 'iPhoneOS9.3.sdk'
      - name: Build Package
        run: make package FINALPACKAGE=1
      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: ZeroGrav-deb
          path: packages/*.deb
