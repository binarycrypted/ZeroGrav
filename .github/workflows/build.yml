name: Build Tweak
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Theos
        uses: waruhachi/theos-action@v2.6.6
        with:
          sdks-src: 'theos/sdks'
      - name: Build Package
        run: make package FINALPACKAGE=1
      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: ZeroGrav-deb
          path: packages/*.deb
